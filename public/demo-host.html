<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostica (demo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffffff; color: #1b2142; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #e2e4f0; display: flex; align-items: center; justify-content: space-between; }
  header .logo { font-weight: 700; }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
  .note {
    font-size: .78rem; color: #6b7299; background: #eef0fa; border-radius: 8px;
    padding: .6rem .9rem; margin-bottom: 1.25rem;
  }
  #login { max-width: 320px; display: flex; flex-direction: column; gap: .6rem; }
  #login label { font-size: .8rem; font-weight: 500; color: #4a5178; }
  #login input {
    padding: .55rem .7rem; border: 1px solid #d5d8e8; border-radius: 7px; font-size: .88rem;
  }
  #login button {
    margin-top: .4rem; padding: .6rem; background: #1b2142; color: #fff; border: none;
    border-radius: 7px; font-weight: 600; cursor: pointer;
  }
  #login .err { color: #b91c1c; font-size: .8rem; display: none; }
  #widget-wrap { display: none; margin-top: 1rem; }
  iframe { width: 100%; min-height: 400px; border: 1px solid #e2e4f0; border-radius: 12px; transition: height .15s ease; }
</style>
</head>
<body>
  <header>
    <div class="logo">Diagnostica</div>
    <div id="whoami" style="font-size:.8rem;color:#6b7299;"></div>
  </header>
  <main>
    <div class="note">
      Esta página simula la página real de Diagnostica: hace login contra el backend mock y le pasa la sesión
      al widget embebido por <code>postMessage</code>, tal como haría la integración real.
    </div>

    <form id="login">
      <label for="email">Email</label>
      <input id="email" type="email" value="admin@diagnostica.com.ar" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" value="admin123" required>
      <button type="submit">Ingresar</button>
      <div class="err" id="err"></div>
    </form>

    <div id="widget-wrap">
      <iframe id="widget-frame" src="/widget"></iframe>
    </div>
  </main>

<script>
  const loginForm = document.getElementById("login");
  const errEl = document.getElementById("err");
  const widgetWrap = document.getElementById("widget-wrap");
  const iframe = document.getElementById("widget-frame");
  const whoami = document.getElementById("whoami");

  let pendingAuth = null;

  // Solo posteamos el token una vez que el iframe avisa que ya está escuchando.
  // También ajustamos el alto del iframe al contenido real que reporta el widget,
  // en vez de dejarlo con una altura fija.
  window.addEventListener("message", (event) => {
    if (event.data?.type === "diagnostica-widget-ready" && pendingAuth) {
      iframe.contentWindow.postMessage({ type: "diagnostica-auth", ...pendingAuth }, "*");
    }
    if (event.data?.type === "diagnostica-widget-resize") {
      iframe.style.height = `${event.data.height}px`;
    }
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/demo-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || "Error al iniciar sesión.";
      errEl.style.display = "block";
      return;
    }

    pendingAuth = { token: data.token, brandId: data.brandId };
    whoami.textContent = `${email} · ${data.brandId}`;
    loginForm.style.display = "none";
    widgetWrap.style.display = "block";

    // Si el iframe ya estaba cargado y listo antes del login, mandamos el token ahora.
    iframe.contentWindow.postMessage({ type: "diagnostica-auth", ...pendingAuth }, "*");
  });
</script>
</body>
</html>
